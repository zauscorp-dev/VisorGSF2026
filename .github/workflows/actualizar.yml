name: Actualizar captura GSF 2026

on:
  schedule:
    # Cada 20 minutos (a los :07, :27 y :47) del 5 al 8 de noviembre (UTC). GitHub a veces salta
    # corridas en horas pico; con varias por hora, el dato nuevo entra aunque se pierda alguna.
    - cron: '7,27,47 * 5-8 11 *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/actualizar.yml', 'scripts/actualizar.py']

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar y limpiar la captura
        env:
          DATALAKE_URL: ${{ secrets.DATALAKE_URL }}
        run: python scripts/actualizar.py
      - name: Publicar si cambió
        run: |
          git config user.name "gsf-bot"
          git config user.email "gsf-bot@users.noreply.github.com"
          if git diff --quiet -- data/captura.csv; then
            echo "Sin pedidos nuevos: no se publica nada"
          else
            git add data/captura.csv data/meta.json
            git commit -m "Captura GSF $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
