name: Actualizar captura GSF 2026

on:
  schedule:
    # A los :15 de cada hora entre el 5 y el 8 de noviembre (UTC). Cubre 8 a. m. – 8 p. m. de Bogotá.
    - cron: '15 * 5-8 11 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar y limpiar la captura
        env:
          DATALAKE_URL: ${{ secrets.DATALAKE_URL }}
        run: python scripts/actualizar.py
      - name: Publicar si cambió
        run: |
          git config user.name "gsf-bot"
          git config user.email "gsf-bot@users.noreply.github.com"
          git add data/captura.csv data/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Captura GSF $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
